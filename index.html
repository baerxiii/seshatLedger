<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seshat Ledger</title>
    <meta
      name="description"
      content="A personal budget planner with custom accounts and trend tracking."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="budget">
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Seshat Ledger</p>
          <h1>Budget Planner</h1>
        </div>

        <nav class="nav-tabs" aria-label="Main navigation">
          <a class="nav-link active" href="index.html">Budget</a>
          <a class="nav-link" href="dashboard.html">Trends</a>
        </nav>
      </header>

      <main class="content-grid budget-layout">
        <section class="card accent-card">
          <div class="section-header">
            <h2>Income</h2>
          </div>

          <label class="field-label" for="paycheckInput">Monthly paycheck</label>
          <div class="input-row">
            <span class="currency">$</span>
            <input id="paycheckInput" type="number" step="0.01" min="0" placeholder="0.00" />
          </div>

          <button id="savePaycheckBtn" type="button" class="primary-btn full-width">Save Paycheck</button>
        </section>

        <section class="card">
          <div class="section-header">
            <h2>Add Expense</h2>
          </div>

          <label class="field-label" for="categoryName">Category</label>
          <input id="categoryName" type="text" placeholder="Rent, groceries, utilities..." />

          <label class="field-label" for="categoryAmount">Amount</label>
          <div class="input-row">
            <span class="currency">$</span>
            <input id="categoryAmount" type="number" step="0.01" min="0" placeholder="0.00" />
          </div>

          <label class="field-label" for="budgetMonth">Month</label>
          <input id="budgetMonth" type="month" />

          <label class="field-label" for="budgetAccount">Account</label>
          <select id="budgetAccount" class="select-field">
            <option value="">Select an account</option>
          </select>

          <button id="addCategoryBtn" type="button" class="primary-btn full-width">Add to Budget</button>
        </section>

        <section class="card">
          <div class="section-header">
            <h2>Accounts</h2>
          </div>

          <div class="account-form-grid">
            <div>
              <label class="field-label" for="accountName">Account name</label>
              <input id="accountName" type="text" placeholder="Checking, Savings..." />
            </div>

            <div>
              <label class="field-label" for="accountType">Type</label>
              <select id="accountType" class="select-field">
                <option value="Checking">Checking</option>
                <option value="Savings">Savings</option>
                <option value="Credit">Credit</option>
                <option value="Cash">Cash</option>
                <option value="Investment">Investment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div>
              <label class="field-label" for="accountBalance">Balance</label>
              <div class="input-row">
                <span class="currency">$</span>
                <input id="accountBalance" type="number" step="0.01" min="0" placeholder="0.00" />
              </div>
            </div>
          </div>

          <button id="addAccountBtn" type="button" class="secondary-btn full-width">Add Account</button>
          <div id="accountList" class="account-list"></div>
        </section>

        <section class="card summary-card">
          <div class="section-header">
            <h2>Overview</h2>
          </div>

          <div class="summary-grid">
            <div class="summary-item">
              <span class="label">Income</span>
              <strong id="incomeValue">$0.00</strong>
            </div>

            <div class="summary-item">
              <span class="label">Budgeted</span>
              <strong id="budgetedValue">$0.00</strong>
            </div>

            <div class="summary-item highlight">
              <span class="label">Remaining</span>
              <strong id="remainingValue">$0.00</strong>
            </div>
          </div>
        </section>

        <section class="card table-card wide-card">
          <div class="section-header split-header">
            <h2>Budget Entries</h2>
            <button id="resetBtn" type="button" class="danger-btn">Reset</button>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Month</th>
                  <th>Account</th>
                  <th>Amount</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="budgetTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
  </body>
</html>
