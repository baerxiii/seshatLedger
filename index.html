<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seshat Ledger</title>
    <meta
      name="description"
      content="A polished personal budget planner with account sync powered by Supabase."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Seshat Ledger</p>
          <h1>Budget Planner</h1>
        </div>

        <div class="auth-panel">
          <div class="auth-row">
            <input id="emailInput" type="email" placeholder="Email" aria-label="Email" />
            <input id="passwordInput" type="password" placeholder="Password" aria-label="Password" />
          </div>

          <div class="auth-actions">
            <button id="signInBtn" type="button" class="primary-btn">Sign In</button>
            <button id="signUpBtn" type="button" class="secondary-btn">Create Account</button>
            <button id="signOutBtn" type="button" class="ghost-btn" disabled>Sign Out</button>
          </div>

          <p id="authStatus" class="auth-status" aria-live="polite">Checking account status...</p>
        </div>
      </header>

      <main class="content-grid">
        <section class="card accent-card">
          <div class="section-header">
            <h2>Income</h2>
          </div>

          <label class="field-label" for="paycheckInput">Monthly paycheck</label>
          <div class="input-row">
            <span class="currency">$</span>
            <input id="paycheckInput" type="number" step="0.01" min="0" placeholder="0.00" />
          </div>

          <button id="savePaycheckBtn" type="button" class="primary-btn full-width">Save Paycheck</button>
        </section>

        <section class="card">
          <div class="section-header">
            <h2>Add Category</h2>
          </div>

          <label class="field-label" for="categoryName">Category</label>
          <input id="categoryName" type="text" placeholder="Rent, groceries, utilities..." />

          <label class="field-label" for="categoryAmount">Amount</label>
          <div class="input-row">
            <span class="currency">$</span>
            <input id="categoryAmount" type="number" step="0.01" min="0" placeholder="0.00" />
          </div>

          <button id="addCategoryBtn" type="button" class="primary-btn full-width">Add Category</button>
        </section>

        <section class="card summary-card">
          <div class="section-header">
            <h2>Overview</h2>
          </div>

          <div class="summary-grid">
            <div class="summary-item">
              <span class="label">Income</span>
              <strong id="incomeValue">$0.00</strong>
            </div>

            <div class="summary-item">
              <span class="label">Budgeted</span>
              <strong id="budgetedValue">$0.00</strong>
            </div>

            <div class="summary-item highlight">
              <span class="label">Remaining</span>
              <strong id="remainingValue">$0.00</strong>
            </div>
          </div>
        </section>

        <section class="card table-card">
          <div class="section-header split-header">
            <h2>Categories</h2>
            <button id="resetBtn" type="button" class="danger-btn">Reset</button>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Amount</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="budgetTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      window.SESHAT_CONFIG = {
        supabaseUrl: "https://cujvvxyadxvlfvhgzlki.supabase.co",
        supabaseAnonKey: "sb_publishable_wogqNQurYqmvOx9FvoFxMQ_XyRMTxZ_"
      };
    </script>
    <script src="app.js"></script>
  </body>
</html>
